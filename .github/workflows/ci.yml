name: CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  web-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  desktop-packages:
    needs: web-and-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: desktop:dist:win
            artifact: windows-x64
          - os: ubuntu-latest
            command: desktop:dist:linux
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: slop-zoo-${{ matrix.artifact }}
          path: release/
          if-no-files-found: error
          retention-days: 5
